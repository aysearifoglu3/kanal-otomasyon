name: video_uret

# Her gun 09:00 UTC'de calisir (Turkiye saatiyle 12:00, yaz saatinde 12:00/11:00)
# Kendi saatine gore cron'u degistirebilirsin: https://crontab.guru
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # istersen Actions sekmesinden elle de tetikleyebilirsin

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Videoyu uret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Video klasorunu bul
        id: klasor
        run: echo "yol=$(ls -td onay_bekleyen/*/ | head -1)" >> "$GITHUB_OUTPUT"

      - name: Onay bekleyen videoyu artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: ${{ steps.klasor.outputs.yol }}
          retention-days: 14
